[project]
name = "diafan-blog-autoposter"
version = "1.0.0"
description = "Automated blog posting pipeline for Diafan.CMS: topic to published article in one command"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "Pillow>=10.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["data", "jobs", "output", "logs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "FURB", "DTZ"]
ignore = ["E501", "DTZ005", "DTZ006"]
